esphome:
  name: bedroom-fan
  includes:
    - interpolation.h

esp32:
  variant: ESP32C3
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# Enable Home Assistant API
api:
  encryption:
    key: "{{API_KEY}}="

# Enable OTA updates
ota:
  platform: esphome

# Enable WiFi (replace with your SSID and password)
wifi:
  power_save_mode: LIGHT
  output_power: 15db
  ssid: "{{WIFI_SSID}}"
  password: "{{WIFI_PSK}}"
  ap:  # Fallback AP if WiFi fails
    ssid: "{{FALLBACK_AP_SSID}}"
    password: "{{FALLBACK_AP_PSK}}"

# Logger and Web server (optional for debugging)
logger:
  level: INFO
web_server:

# PWM Outputs on GPIOs (adjust pins based on your setup)
output:
  - platform: ledc
    pin: GPIO20
    id: pwm_1
    frequency: 19531Hz
  - platform: ledc
    pin: GPIO18
    id: pwm_2
    frequency: 19531Hz
  - platform: ledc
    pin: GPIO9
    id: pwm_3
    frequency: 19531Hz
  - platform: ledc
    pin: GPIO7
    id: pwm_4
    frequency: 19531Hz

# Define the DHT11 sensor
sensor:
  - platform: dht
    id: radiator_dht11
    pin: GPIO4
    model: DHT11
    temperature:
      name: "Radiator Temperature"
      id: radiator_temperature
      on_value:
        then:
          - script.execute: update_fan_speed
    humidity:
      name: "Radiator Humidity"
      id: radiator_humidity
    update_interval: 10s
    
  - platform: homeassistant
    name: "Room Temperature"
    entity_id: sensor.sonoff_snzb_02d_temperature
    id: room_temperature
    internal: false
    on_value:
      then:
        - script.execute: update_fan_speed

    

# not working
  - platform: pulse_counter 
    pin:
      number: GPIO21
      mode: INPUT_PULLUP
    unit_of_measurement: 'RPM'
    id: speed_1
    name: speed 1
    update_interval: 5s
    filters:
      - multiply: 0.5

  - platform: pulse_counter
    pin:
      number: GPIO19
      mode: INPUT_PULLUP
    unit_of_measurement: 'RPM'
    id: speed_2
    name: speed 2
    update_interval: 5s
    filters:
      - multiply: 0.5

  # not working pin
  # - platform: pulse_counter
  #   pin:
  #     number: GPIO10
  #     mode: INPUT_PULLUP
  #   unit_of_measurement: 'RPM'
  #   id: speed_3
  #   name: speed 3
  #   update_interval: 5s
  #   filters:
  #     - multiply: 0.5
      
  - platform: pulse_counter
    pin:
      number: GPIO8
      mode: INPUT_PULLUP
    unit_of_measurement: 'RPM'
    id: speed_4
    name: speed 4
    update_interval: 5s
    filters:
      - multiply: 0.5

# Expose PWM controls
fan:
  - platform: speed
    output: pwm_1
    name: "Fan 1"
  - platform: speed
    output: pwm_2
    name: "Fan 2"
  - platform: speed
    output: pwm_3
    name: "Fan 3"
  - platform: speed
    output: pwm_4
    name: "Fan 4"

script:
  - id: update_fan_speed
    then:
      - lambda: |- 
          float speed = 0.0f;
          float radiator_temp = id(radiator_temperature).state;
          float room_temp = id(room_temperature).state;
          
          // Set fan speed depending on actual radiator temperature
          float min_radiator_temp = 22.0f;
          float max_radiator_temp = 37.0f;
          float min_temp_speed = 0.05f;
          float max_temp_speed = 1.0f;
          float min_temp_difference = 5.0f;
          bool radiator_hot_enough = radiator_temp >= min_radiator_temp;
          // Ignore room temp difference check if the room sensor is unavailable (NaN)
          bool temp_diff_ok = isnan(room_temp) || (radiator_temp - room_temp) >= min_temp_difference;
          if (radiator_hot_enough && temp_diff_ok) {
            float temp_speed = utils::linear_interpolation(radiator_temp, min_radiator_temp, min_temp_speed, max_radiator_temp, max_temp_speed);
            speed = max(speed, temp_speed); // Use max to ensure we don't reduce speed from heating value
          }
          
          //log all values
          ESP_LOGI("update_fan_speed", "Radiator %.1fºC, Room %.1fºC, Speed %3.0f%%", radiator_temp, room_temp, 100*speed);

          // apply to all 4 pwm outputs sequentially
          id(pwm_1).set_level(speed);
          id(pwm_2).set_level(speed);
          id(pwm_3).set_level(speed);
          id(pwm_4).set_level(speed);
